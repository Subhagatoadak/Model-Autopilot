[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-autopilot"
version = "0.1.0"
description = "LLM-agent-driven ML model optimization platform"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Subhagato Adak"}]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-multipart",
    "aiosqlite",
    "websockets",
    "openai>=1.40",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "torch>=2.2",
    "tensorflow>=2.16",
    "pandas>=2.2",
    "numpy>=1.26",
    "psycopg2-binary",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
