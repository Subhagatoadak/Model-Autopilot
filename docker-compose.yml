services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "4381:4381"
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/events.db
      - CORS_ENABLED=true
      - CORS_ORIGINS=http://localhost:3000,http://localhost:4381
    volumes:
      - app-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  app-data:
